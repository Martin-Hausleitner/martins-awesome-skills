name: Public Safety

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run public safety audit
        run: scripts/audit-public-safety.sh
      - name: Run skill sync doctor tests
        run: node --test tests/skill-sync-doctor.test.mjs
      - name: Run cross-agent skill sync tests
        run: node --test skills/software-development/cross-agent-skill-sync/tests/cross_agent_skill_sync.test.mjs
      - name: Run AI research output publisher tests
        run: python3 -m unittest discover -s skills/productivity/ai-research-output-publisher/tests -p 'test_*.py'
      - name: Run Oracle AI Research E2E skill tests
        run: python3 -m unittest discover -s skills/software-development/oracle-ai-research-e2e/tests -p 'test_*.py'
      - name: Run Oracle AI Research E2E checker
        run: python3 skills/software-development/oracle-ai-research-e2e/scripts/oracle_ai_research_e2e_check.py --quick --json
      - name: Run Telegram approval tests
        run: python3 skills/telegram-approval-gate/tests/test_telegram_approval_gate.py
      - name: Run Telegram channel poster tests
        run: |
          cd skills/telegram-channel-poster
          python3 scripts/test_telegram_channel_post.py
