<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Public safety pipeline</title>
  <desc id="desc">A visual pipeline showing scan, redact, test, and publish steps for public-safe agent skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <style>
      .text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .title{font-size:28px;font-weight:760}
      .step{font-size:18px;font-weight:720}
      .small{font-size:13px;fill:#475569}
      .card{fill:#fff;stroke:#fed7aa;stroke-width:1.3;rx:8;filter:url(#shadow)}
      .arrow{stroke:#94a3b8;stroke-width:3;stroke-linecap:round;fill:none;marker-end:url(#arrow)}
      .icon{font-size:28px}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="url(#bg)"/>
  <text x="460" y="42" text-anchor="middle" class="text title">Public-Safe Publish Pipeline</text>
  <text x="460" y="68" text-anchor="middle" class="text small">no private memories, no credentials, no browser sessions, no machine-specific state</text>

  <path class="arrow" d="M184 158 H246"/>
  <path class="arrow" d="M374 158 H436"/>
  <path class="arrow" d="M564 158 H626"/>

  <g>
    <rect x="36" y="104" width="148" height="110" class="card"/>
    <circle cx="110" cy="130" r="22" fill="url(#scan)"/>
    <text x="110" y="139" text-anchor="middle" font-size="24">🔎</text>
    <text x="110" y="170" text-anchor="middle" class="text step">Scan</text>
    <text x="110" y="194" text-anchor="middle" class="text small">skills + docs</text>
  </g>

  <g>
    <rect x="226" y="104" width="148" height="110" class="card"/>
    <circle cx="300" cy="130" r="22" fill="#2563eb"/>
    <text x="300" y="139" text-anchor="middle" font-size="24">▣</text>
    <text x="300" y="170" text-anchor="middle" class="text step">Redact</text>
    <text x="300" y="194" text-anchor="middle" class="text small">paths + prompts</text>
  </g>

  <g>
    <rect x="416" y="104" width="148" height="110" class="card"/>
    <circle cx="490" cy="130" r="22" fill="#7c3aed"/>
    <text x="490" y="139" text-anchor="middle" font-size="24">✓</text>
    <text x="490" y="170" text-anchor="middle" class="text step">Test</text>
    <text x="490" y="194" text-anchor="middle" class="text small">fake services first</text>
  </g>

  <g>
    <rect x="606" y="104" width="148" height="110" class="card"/>
    <circle cx="680" cy="130" r="22" fill="url(#safe)"/>
    <text x="680" y="139" text-anchor="middle" font-size="24">↗</text>
    <text x="680" y="170" text-anchor="middle" class="text step">Publish</text>
    <text x="680" y="194" text-anchor="middle" class="text small">CI green on main</text>
  </g>

  <rect x="224" y="245" width="472" height="28" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="460" y="264" text-anchor="middle" class="text small">GitGuardian + public-safety audit + deterministic tests guard every release</text>
</svg>
