<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Cross-agent skill sync architecture</title>
  <desc id="desc">A central public-safe skill catalog projects reviewed SKILL.md packages into local agent roots for Hermes, Codex, Claude, Gemini, OpenCode, and OpenClaw.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f7fff9"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .label{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .small{font-size:15px}
      .tiny{font-size:13px;fill:#475569}
      .title{font-size:30px;font-weight:760}
      .card-title{font-size:17px;font-weight:720}
      .line{stroke:#94a3b8;stroke-width:2.4;stroke-linecap:round}
      .card{fill:#ffffff;stroke:#dbeafe;stroke-width:1.5;rx:8;filter:url(#soft)}
      .pill{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1}
    </style>
  </defs>
  <rect width="920" height="360" fill="url(#bg)"/>
  <text x="460" y="46" text-anchor="middle" class="label title">Cross-Agent Skill Sync</text>
  <text x="460" y="73" text-anchor="middle" class="label small">one reviewed skill layer, projected additively into local agent roots</text>

  <g class="line">
    <path d="M460 149 C350 128 282 109 214 98"/>
    <path d="M460 149 C572 128 640 109 706 98"/>
    <path d="M460 184 C345 198 282 218 214 250"/>
    <path d="M460 184 C575 198 640 218 706 250"/>
    <path d="M460 166 C460 222 460 251 460 276"/>
  </g>

  <g filter="url(#soft)">
    <rect x="330" y="106" width="260" height="112" rx="8" fill="url(#hub)"/>
    <text x="460" y="143" text-anchor="middle" class="label" font-size="22" font-weight="760" fill="#ffffff">Public Skill Catalog</text>
    <text x="460" y="172" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui" font-size="15" fill="#dbeafe">SKILL.md + scripts + tests</text>
    <rect x="375" y="188" width="170" height="22" rx="11" fill="#ffffff" opacity="0.18"/>
    <text x="460" y="204" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui" font-size="12" fill="#ffffff">dry-run first, no overwrite</text>
  </g>

  <g>
    <rect x="68" y="58" width="178" height="82" class="card"/>
    <text x="157" y="89" text-anchor="middle" class="label card-title">Hermes</text>
    <text x="157" y="115" text-anchor="middle" class="label tiny">preserve categories</text>

    <rect x="674" y="58" width="178" height="82" class="card"/>
    <text x="763" y="89" text-anchor="middle" class="label card-title">Codex</text>
    <text x="763" y="115" text-anchor="middle" class="label tiny">flat skill root</text>

    <rect x="68" y="220" width="178" height="82" class="card"/>
    <text x="157" y="251" text-anchor="middle" class="label card-title">OpenClaw</text>
    <text x="157" y="277" text-anchor="middle" class="label tiny">workspace skills</text>

    <rect x="674" y="220" width="178" height="82" class="card"/>
    <text x="763" y="251" text-anchor="middle" class="label card-title">Gemini + OpenCode</text>
    <text x="763" y="277" text-anchor="middle" class="label tiny">local compatible roots</text>

    <rect x="371" y="256" width="178" height="68" class="card"/>
    <text x="460" y="284" text-anchor="middle" class="label card-title">Claude-adjacent</text>
    <text x="460" y="307" text-anchor="middle" class="label tiny">bridge/index friendly</text>
  </g>

  <g>
    <rect x="292" y="22" width="118" height="24" rx="12" class="pill"/>
    <text x="351" y="39" text-anchor="middle" class="label tiny">redacted reports</text>
    <rect x="510" y="22" width="120" height="24" rx="12" class="pill"/>
    <text x="570" y="39" text-anchor="middle" class="label tiny">public-safe audit</text>
  </g>
</svg>
