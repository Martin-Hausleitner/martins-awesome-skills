<svg width="1120" height="680" viewBox="0 0 1120 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized AI Research Browser proof cards</title>
  <desc id="desc">Screenshot-style cards showing sanitized command evidence for Oracle integration, model safety, target isolation, and tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1120" height="680" rx="32" fill="url(#bg)"/>
  <text x="64" y="78" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="850">Evidence Cards</text>
  <text x="64" y="112" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Public-safe proof snapshots. Real account names, prompts, URLs, and provider content stay redacted.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" filter="url(#shadow)">
    <rect x="64" y="154" width="470" height="190" rx="20" fill="#0F172A"/>
    <circle cx="92" cy="184" r="7" fill="#EF4444"/>
    <circle cx="116" cy="184" r="7" fill="#F59E0B"/>
    <circle cx="140" cy="184" r="7" fill="#22C55E"/>
    <text x="86" y="224" fill="#93C5FD" font-size="15">$ ai_research_browser.py oracle-plan</text>
    <text x="86" y="254" fill="#E2E8F0" font-size="14">package: @steipete/oracle@0.13.0</text>
    <text x="86" y="278" fill="#E2E8F0" font-size="14">--browser-attach-running --remote-chrome</text>
    <text x="86" y="302" fill="#E2E8F0" font-size="14">--browser-research deep</text>
    <text x="86" y="326" fill="#86EFAC" font-size="14">status + reattach + show_session ready</text>

    <rect x="586" y="154" width="470" height="190" rx="20" fill="#111827"/>
    <circle cx="614" cy="184" r="7" fill="#EF4444"/>
    <circle cx="638" cy="184" r="7" fill="#F59E0B"/>
    <circle cx="662" cy="184" r="7" fill="#22C55E"/>
    <text x="608" y="224" fill="#FCA5A5" font-size="15">$ workflow-run --oracle-mode runner</text>
    <text x="608" y="254" fill="#E5E7EB" font-size="14">status: blocked</text>
    <text x="608" y="278" fill="#E5E7EB" font-size="14">runner_status: blocked-by-local-guards</text>
    <text x="608" y="302" fill="#E5E7EB" font-size="14">prompt_redacted: true</text>
    <text x="608" y="326" fill="#FDE68A" font-size="14">Oracle cannot bypass login/plan guards</text>

    <rect x="64" y="394" width="470" height="190" rx="20" fill="#082F49"/>
    <circle cx="92" cy="424" r="7" fill="#EF4444"/>
    <circle cx="116" cy="424" r="7" fill="#F59E0B"/>
    <circle cx="140" cy="424" r="7" fill="#22C55E"/>
    <text x="86" y="464" fill="#BAE6FD" font-size="15">$ unittest -k chatgpt_model_safety</text>
    <text x="86" y="494" fill="#E0F2FE" font-size="14">blocks: Pro / Extended Pro / GPT-5.5 Pro</text>
    <text x="86" y="518" fill="#E0F2FE" font-size="14">allows: non-Pro Thinking / Agent / Research</text>
    <text x="86" y="542" fill="#E0F2FE" font-size="14">does not confuse ChatGPT Plus plan</text>
    <text x="86" y="566" fill="#86EFAC" font-size="14">5 tests OK</text>

    <rect x="586" y="394" width="470" height="190" rx="20" fill="#064E3B"/>
    <circle cx="614" cy="424" r="7" fill="#EF4444"/>
    <circle cx="638" cy="424" r="7" fill="#F59E0B"/>
    <circle cx="662" cy="424" r="7" fill="#22C55E"/>
    <text x="608" y="464" fill="#A7F3D0" font-size="15">$ unittest discover</text>
    <text x="608" y="494" fill="#D1FAE5" font-size="14">237 tests in 32.235s</text>
    <text x="608" y="518" fill="#D1FAE5" font-size="14">py_compile OK</text>
    <text x="608" y="542" fill="#D1FAE5" font-size="14">git diff --check OK</text>
    <text x="608" y="566" fill="#86EFAC" font-size="14">no slash fallback before guard</text>
  </g>
</svg>
